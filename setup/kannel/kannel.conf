# kannel.conf  (TEMPLATE - 40-install-kannel.sh fills in the passwords and installs it to /etc/kannel)
#
# Kannel is OPTIONAL. Cyclos 4 can call the bridge's /cgi-bin/sendsms URL directly, so you only need
# Kannel if other tooling you run expects to talk to Kannel. Here Kannel treats the phone-gateway
# bridge (bridge/bridge.py) as its SMSC via Kannel's "generic" HTTP SMSC type.
# Inbound SMS does not go through Kannel: the bridge's /webhook forwards it straight to Cyclos.
#
# The <CHANGE_ME_*> markers are replaced by the install script. Never commit a filled-in copy.

group = core
admin-port = 13000
smsbox-port = 13001
admin-password = <CHANGE_ME_ADMIN_PASSWORD>
log-file = "/var/log/kannel/bearerbox.log"
log-level = 1
box-deny-ip = "*.*.*.*"
box-allow-ip = "127.0.0.1"

group = smsc
smsc = http
system-type = "generic"
# port on which bearerbox listens for this SMSC's callbacks - must differ from sendsms-port below
port = 13014
smsc-id = phone-gateway
send-url = "http://127.0.0.1:5000/cgi-bin/sendsms?username=cyclos&password=<CHANGE_ME_SENDSMS_PASSWORD>&to=%p&text=%b"

group = smsbox
bearerbox-host = 127.0.0.1
sendsms-port = 13013
log-file = "/var/log/kannel/smsbox.log"
log-level = 1

group = sendsms-user
username = cyclos
password = <CHANGE_ME_SENDSMS_PASSWORD>
user-allow-ip = "127.0.0.1"
